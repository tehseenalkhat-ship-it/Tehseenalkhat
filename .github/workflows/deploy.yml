name: Deploy via FTP
on:
  push:
    branches: [main]
  workflow_dispatch:

# One Node.js app serves both the API and the website:
#   khat-backend/dist/server.cjs   bundled backend
#   khat-backend/dist/public/      built frontend (served by the backend)
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional repository variable: FTP_BACKEND_DIR (default ./app/ inside the FTP account root)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend (same-origin API)
        working-directory: khat-frontend
        run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: ''

      - name: Bundle backend and add the frontend
        working-directory: khat-backend
        run: |
          npm ci
          npm run bundle
          cp -r ../khat-frontend/dist dist/public

      - name: Upload to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: khat-backend/dist/
          server-dir: ${{ vars.FTP_BACKEND_DIR || './app/' }}
